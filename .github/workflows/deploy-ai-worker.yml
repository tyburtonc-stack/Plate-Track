# Deploys platetrack-ai-worker/ to Cloudflare as the "platetrack-ai" worker.
# Runs when the worker changes on main, or by hand from the Actions tab.
# Repo secrets needed: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY.
name: Deploy AI worker

on:
  push:
    branches: [main]
    paths: ['platetrack-ai-worker/**', '.github/workflows/deploy-ai-worker.yml']
  workflow_dispatch:

concurrency: deploy-ai-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platetrack-ai-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets are set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$ANTHROPIC_API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets first:$missing"; exit 1; fi
      - run: npm ci
      - run: npm test
      # Wrangler's own error lines are repeated as annotations so they show in the run summary
      # and the failure email, not only in the full log.
      - name: Deploy to Cloudflare
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log || {
            grep -E 'ERROR|✘|Authentication|Could not|code: [0-9]+|workers.dev|subdomain|account' deploy.log | head -15 | sed 's/^/::error::/'
            exit 1
          }
      - name: Set the Anthropic API key on the worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY 2>&1 | tee secret.log || {
            grep -E 'ERROR|✘|Authentication|Could not|code: [0-9]+' secret.log | head -15 | sed 's/^/::error::/'
            exit 1
          }
