# Runs the test suite on every pull request, so problems show up before anything reaches main.
name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Pinned: ubuntu-latest is now 26.04, where Playwright 1.56.1 can't install Chromium.
    # Move to ubuntu-latest again after upgrading Playwright to a version that supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - run: npm test
